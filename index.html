<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <script src="basket.js" defer></script>
  </head>
  <body>
    <button id="new-game" onclick="newGame()">New Game</button>
    <div class="container">
      <div class="score-cont">
        <h3>HOME</h3>
        <p id="home-score">0</p>
        <div class="buttons">
          <button onclick="home1()">+1</button>
          <button onclick="home2()">+2</button>
          <button onclick="home3()">+3</button>
        </div>
      </div>
      <div class="score-cont">
        <h3>AWAY</h3>
        <p id="guest-score">0</p>
        <div class="buttons">
          <button onclick="guest1()">+1</button>
          <button onclick="guest2()">+2</button>
          <button onclick="guest3()">+3</button>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
